name: Review tool checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,dev]'
      - run: ruff check coding_review tests examples
      - run: ruff format --check coding_review tests examples
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --wheel-dir dist .
